
name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          if ($env:RDP_PASSWORD.Length -lt 12) {
            throw "RDP password must be at least 12 characters."
          }

          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          Set-LocalUser -Name "runneradmin" -Password $Password

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Show connection details
        shell: pwsh
        run: |
          Write-Host "Tailscale IP:"
          tailscale ip -4
          Write-Host "Username: runneradmin"
          Write-Host "Password: Use your RDP_PASSWORD GitHub Secret"

      - name: Keep runner active
        shell: pwsh
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
